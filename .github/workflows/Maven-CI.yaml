name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
      
jobs:
  build_and_verify:
    runs-on: ubuntu-latest
      
    # ... (omitting name, on, and jobs: build: for brevity)
    steps:
    - uses: actions/checkout@v4

    # The 'cache: maven' line is already doing dependency caching 
    # and is the recommended way with 'setup-java'.

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # This handles caching of .m2/repository

    - name: Build and Test with Maven
      run: mvn -B -f path/to/your/pom.xml clean verify

    - name: Upload Test Results Artifact
      if: always() # Run this even if the previous step failed
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/
