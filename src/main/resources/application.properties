# Application name
application.name=cumulocity-maintenance-module

## Server configuration
#server.port=8080
#spring.ai.openai.api-key=

#spring.ai.openai.chat.options.model=gpt-4
#spring.ai.openai.chat.options.temperature=0.7


#Do not edit, version properties are set at build time
c8y.version=@c8y.version@
microservice.version=@project.version@
#Cumulocity configuration for running locally and connecting to Cumulocity

management.endpoints.web.exposure.include=health, loggers
#spring.ai.chat.client.enabled=false

#gemini config
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
#spring.ai.google.genai.chat.options.max-output-tokens=200
# Change this for production deployment or override this with -Dspring.profiles.active=prod
# Available profiles: dev, test, prod
spring.profiles.active=prod
# Enable pretty printing for OpenAPI documentation
springdoc.writer-with-default-pretty-printer=true
# Controls the inclusion of properties during serialization.
spring.jackson.default-property-inclusion=NON_NULL

# Enable OpenAPI 3.1.0 (instead of default 3.0.1)
springdoc.api-docs.version=openapi_3_1